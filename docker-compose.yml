version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: predem-postgres
    environment:
      POSTGRES_USER: predem_dev
      POSTGRES_PASSWORD: predem_dev_password
      POSTGRES_DB: predem_db
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predem_dev -d predem_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - predem-network

  redis:
    image: redis:7-alpine
    container_name: predem-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - predem-network

  minio:
    image: minio/minio:latest
    container_name: predem-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - predem-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: predem-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - predem-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  predem-network:
    driver: bridge
